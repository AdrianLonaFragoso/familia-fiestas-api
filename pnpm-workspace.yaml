# Configuración de pnpm para este proyecto.

# 24h de espera antes de instalar versiones recién publicadas.
minimumReleaseAge: 1440

# Solo estos paquetes pueden ejecutar scripts de instalación.
allowBuilds:
  # Telemetría de instalación de Swagger; no se necesita para ejecutar la API.
  "@scarf/scarf": false
  "@prisma/engines": true
  esbuild: true
  prisma: true
